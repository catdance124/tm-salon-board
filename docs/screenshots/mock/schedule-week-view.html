<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サロンボード - スケジュール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Meiryo", "メイリオ", sans-serif; font-size: 12px; background: #f0f4f8; color: #333; }
.header { background: linear-gradient(180deg, #5a9fd4 0%, #3a7fc1 100%); color: #fff; padding: 6px 12px; display: flex; align-items: center; gap: 16px; }
.header .logo { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
.nav { background: #3a7fc1; display: flex; gap: 2px; padding: 0 8px; }
.nav a { color: #fff; padding: 8px 14px; font-size: 12px; text-decoration: none; display: block; }
.nav a:hover, .nav a.active { background: #2a6aaa; }
.subnav { background: #dce8f5; padding: 4px 12px; display: flex; gap: 8px; }
.subnav a { color: #3a7fc1; text-decoration: none; font-size: 12px; padding: 4px 10px; border-radius: 3px; border: 1px solid #aac8e8; background: #fff; }
.subnav a.active { background: #3a7fc1; color: #fff; border-color: #3a7fc1; }
.contents { padding: 8px 12px; }
.scheduleHeader { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.scheduleHeader .date-nav { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: bold; }
.scheduleHeader .date-nav a { color: #3a7fc1; text-decoration: none; font-size: 16px; }
/* The original schedule grid */
.schedule-grid { border: 1px solid #b0c4d8; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
.schedule-grid-header { display: grid; grid-template-columns: 100px repeat(12, 1fr); background: #d0e0f0; border-bottom: 1px solid #b0c4d8; }
.schedule-grid-header div { padding: 4px 2px; text-align: center; font-size: 11px; border-right: 1px solid #b0c4d8; }
.schedule-row { display: grid; grid-template-columns: 100px repeat(12, 1fr); border-bottom: 1px solid #e0e8f0; }
.schedule-row:last-child { border-bottom: none; }
.schedule-row .staff-name { padding: 6px 8px; font-size: 12px; background: #f4f8fc; border-right: 1px solid #c8d8e8; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
.schedule-row .cell { border-right: 1px solid #e8eef5; min-height: 40px; position: relative; }
.schedule-row .cell.holiday { background: #e8e8e8; }
.resv-block { position: absolute; top: 2px; left: 1px; right: 1px; border-radius: 2px; padding: 1px 3px; font-size: 10px; white-space: nowrap; overflow: hidden; }
/* Footer nav */
.scheduleNavBar { background: #dce8f5; padding: 6px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px solid #b0c4d8; margin-top: 0; }
.scheduleNavBar a, .scheduleNavBar button { color: #3a7fc1; text-decoration: none; font-size: 12px; padding: 3px 8px; border-radius: 2px; border: 1px solid #aac8e8; background: #fff; cursor: pointer; }
.scheduleCalenderPager { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
